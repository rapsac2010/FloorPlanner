[project]
name = "backend"
version = "0.1.0"
description = "FloorPlanner API backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "python-multipart>=0.0.22",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
